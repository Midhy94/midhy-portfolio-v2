<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Dynamic SVG Favicon (Contains embedded light/dark media queries) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=8" />

    <!-- OS Light Mode Devices (Dark Favicon on light tabs) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-dark.png?v=8" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-dark-16.png?v=8" media="(prefers-color-scheme: light)" />

    <!-- OS Dark Mode Devices (Light Favicon on dark tabs) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-light.png?v=8" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-light-16.png?v=8" media="(prefers-color-scheme: dark)" />

    <!-- Touch Icon & ICO Fallback -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=8" />
    <link rel="shortcut icon" href="/favicon.ico?v=8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Midhun M. — Senior UI/UX & Product Designer</title>
    <meta name="description" content="Senior UI/UX & Product Designer with 10+ years of experience spanning fintech, SaaS, and hospitality. Specializing in AI-assisted workflows, design systems, and digital experiences." />
    
    <!-- Preconnect & Fonts: Newsreader (Editorial Serif), Merriweather Sans (Display/Accent), Plus Jakarta Sans (Clean Modern Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
